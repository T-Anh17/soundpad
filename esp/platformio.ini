; SoundPad firmware - LilyGO T-Display-S3 (màn hình đã tháo)
;
;   pio run -e soundpad -t upload        bản dùng thật (có ngủ nhẹ / ngủ sâu)
;   pio run -e soundpad-debug -t upload  bản thử: không ngủ, có log Serial
;   pio device monitor
;
; Web (../web, React) chạy riêng trên điện thoại / máy tính, nói chuyện với board qua Bluetooth LE.

[platformio]
; Mặc định bản dùng thật (có ngủ). Thử nghiệm, xem log: pio run -e soundpad-debug -t upload
default_envs = soundpad

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
board = lilygo-t-display-s3
framework = arduino
; Nguồn framework trùng bản đã cài trên máy (cùng Arduino 3.1.1 / IDF 5.3.2). Không khai báo thì
; platform đòi tải lại file zip trên github.com -> lỗi ConnectTimeout khi mạng chặn GitHub
platform_packages =
  framework-arduinoespressif32 @ git+https://github.com/espressif/arduino-esp32.git#3.1.1
  framework-arduinoespressif32-libs @ https://dl.espressif.com/AE/esp-arduino-libs/esp32-3.1.1-h.zip
board_build.partitions = partitions.csv
board_build.f_cpu = 80000000L
monitor_speed = 115200
extra_scripts = pre:scripts/embed_wifi_sound.py

[env:soundpad]
build_flags =
  -DENABLE_SLEEP=1
  -DCORE_DEBUG_LEVEL=0

[env:soundpad-debug]
build_flags =
  -DENABLE_SLEEP=0
  -DCORE_DEBUG_LEVEL=3
