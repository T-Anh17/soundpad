; SoundPad firmware - LilyGO T-Display-S3 (màn hình đã tháo)
;
;   pio run -e soundpad -t upload        bản dùng thật (có ngủ nhẹ / ngủ sâu)
;   pio run -e soundpad-debug -t upload  bản thử: không ngủ, có log Serial
;   pio device monitor
;
; Web trong ../web/index.html được nén và nhúng vào firmware mỗi lần build.

[platformio]
; Đang thử nghiệm: mặc định bản không ngủ. Khi dùng chính thức đổi lại thành soundpad
default_envs = soundpad-debug

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
board = lilygo-t-display-s3
framework = arduino
board_build.partitions = partitions.csv
board_build.f_cpu = 80000000L
monitor_speed = 115200
extra_scripts = pre:scripts/embed_web.py, pre:scripts/embed_wifi_sound.py

[env:soundpad]
build_flags =
  -DENABLE_SLEEP=1
  -DCORE_DEBUG_LEVEL=0

[env:soundpad-debug]
build_flags =
  -DENABLE_SLEEP=0
  -DCORE_DEBUG_LEVEL=3
